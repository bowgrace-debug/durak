<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Durak – Tracker</title>
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3f;
      --accent: #e63946;
      --accent2: #457b9d;
      --gold: #f4a261;
      --text: #e8e8f0;
      --muted: #7070a0;
      --green: #2a9d8f;
      --silver: #9ca3b0;
      --bronze: #c97c3a;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header .logo { font-size: 1.7rem; }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.04em; }
    header h1 span { color: var(--accent); }
    header .sub { font-size: 0.76rem; color: var(--muted); margin-top: 0.1rem; }

    main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 700px) {
      main { grid-template-columns: 320px 1fr; }
      .span2 { grid-column: 1 / -1; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    input, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.85rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    input:focus, select:focus { border-color: var(--accent2); }
    input::placeholder { color: var(--muted); }

    .select-wrap {
      position: relative;
    }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
      font-size: 0.85rem;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.6rem 1.1rem;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
      padding: 0.72rem;
      margin-top: 0.25rem;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.87; }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .btn-ghost:hover { border-color: var(--accent2); }

    .btn-icon {
      background: transparent;
      color: var(--muted);
      border: none;
      font-size: 0.95rem;
      padding: 0.3rem 0.4rem;
      line-height: 1;
      border-radius: 6px;
    }
    .btn-icon:hover { color: var(--text); background: var(--surface2); }

    .btn-link {
      background: transparent;
      color: var(--accent);
      border: none;
      font-size: 0.78rem;
      padding: 0.2rem 0.4rem;
    }
    .btn-link:hover { opacity: 0.8; }

    /* Players list */
    .add-row { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; }
    .add-row input { flex: 1; }

    .player-chip {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.65rem;
      margin-bottom: 0.35rem;
      font-size: 0.88rem;
    }
    .player-chip .name { flex: 1; }

    /* Avatar */
    .av {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 700;
      flex-shrink: 0;
    }
    .av-sm { width: 22px; height: 22px; font-size: 0.6rem; }

    /* Place rows in form */
    .place-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.65rem;
    }
    .place-label {
      font-size: 1.3rem;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .place-row .select-wrap { flex: 1; }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.65rem;
    }
    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 0.9rem;
      text-align: center;
    }
    .stat-box .val { font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
    .stat-box .lbl { font-size: 0.7rem; color: var(--muted); margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.06em; }

    /* Leaderboard table */
    .board { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    .board th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    .board td { padding: 0.58rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .board tr:last-child td { border-bottom: none; }
    .board tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
    }
    .badge-gold   { background: rgba(244,162,97,.2);  color: var(--gold); }
    .badge-silver { background: rgba(156,163,176,.2); color: var(--silver); }
    .badge-durak  { background: rgba(230,57,70,.2);   color: var(--accent); }

    /* History */
    .history { display: flex; flex-direction: column; gap: 0.45rem; max-height: 400px; overflow-y: auto; }
    .history::-webkit-scrollbar { width: 4px; }
    .history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .hi {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.83rem;
    }
    .hi-date { color: var(--muted); font-size: 0.73rem; white-space: nowrap; flex-shrink: 0; }
    .hi-body { flex: 1; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .hi-place { display: flex; align-items: center; gap: 0.3rem; }

    /* Empty */
    .empty { text-align: center; padding: 1.8rem 1rem; color: var(--muted); font-size: 0.86rem; }
    .empty .ico { font-size: 1.8rem; margin-bottom: 0.4rem; }

    /* Toast */
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.65rem 1.1rem;
      font-size: 0.86rem; z-index: 100;
      transition: transform 0.25s; pointer-events: none; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Dialog */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 200;
      align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .dialog {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
      max-width: 320px; width: 90%;
    }
    .dialog h3 { margin-bottom: 0.45rem; }
    .dialog p { color: var(--muted); font-size: 0.86rem; margin-bottom: 1.2rem; line-height: 1.5; }
    .dialog-btns { display: flex; gap: 0.5rem; justify-content: flex-end; }

    /* Auth */
    .auth-bar { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }
    .auth-bar .btn-ghost { margin-top: 0; }
    .user-name { font-size: 0.8rem; color: var(--muted); }

    /* Auth guard: hide app until session verified */
    .app-loading { display: none; }
    .auth-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 420px) {
      .board .hide-xs { display: none; }
    }
  </style>
</head>
<body>

<div id="authLoading" class="auth-loading">Sitzung wird geprüft…</div>

<header class="app-loading">
  <div class="logo">🃏</div>
  <div>
    <h1>Durak <span>Tracker</span></h1>
    <div class="sub">Wer ist der Dummkopf?</div>
  </div>
  <div class="auth-bar">
    <div id="userBar" style="display:none;align-items:center;gap:0.5rem">
      <span id="userName" class="user-name"></span>
      <button class="btn-ghost" onclick="signOutUser()">Abmelden</button>
    </div>
  </div>
</header>

<main class="app-loading">

  <!-- LEFT COLUMN -->
  <div style="display:flex;flex-direction:column;gap:1.5rem">

    <!-- Spieler verwalten -->
    <div class="card">
      <div class="card-title">♟ Spieler</div>
      <div class="add-row">
        <input id="nameInput" type="text" placeholder="Name eingeben…" maxlength="20" />
        <button class="btn-ghost" onclick="addPlayer()">+ Add</button>
      </div>
      <div id="playerList"></div>
    </div>

    <!-- Neue Runde -->
    <div class="card">
      <div class="card-title">♦ Neue Runde</div>

      <div class="place-row">
        <div class="place-label">🥇</div>
        <div class="select-wrap">
          <select id="sel1"><option value="">– 1. Platz –</option></select>
        </div>
      </div>
      <div class="place-row">
        <div class="place-label">🥈</div>
        <div class="select-wrap">
          <select id="sel2"><option value="">– 2. Platz –</option></select>
        </div>
      </div>
      <div class="place-row">
        <div class="place-label">🃏</div>
        <div class="select-wrap">
          <select id="selD"><option value="">– Durak –</option></select>
        </div>
      </div>

      <div style="margin-top:0.2rem">
        <div style="font-size:0.78rem;color:var(--muted);margin-bottom:0.4rem">Datum</div>
        <input type="date" id="gameDate" />
      </div>

      <button class="btn-primary" onclick="recordGame()">Runde speichern ✓</button>
    </div>

  </div>

  <!-- RIGHT COLUMN -->
  <div style="display:flex;flex-direction:column;gap:1.5rem">

    <!-- Übersicht -->
    <div class="card">
      <div class="card-title">📊 Übersicht</div>
      <div class="stats-grid" id="statsRow"></div>
    </div>

    <!-- Rangliste -->
    <div class="card">
      <div class="card-title">🏆 Rangliste</div>
      <div id="leaderboard"></div>
    </div>

  </div>

  <!-- FULL WIDTH: History -->
  <div class="card span2">
    <div class="card-title">
      <span>📜 Spielverlauf</span>
      <button class="btn-link" onclick="confirmClear()">Alle löschen</button>
    </div>
    <div class="history" id="historyList"></div>
  </div>

</main>

<div id="toast" class="app-loading"></div>

<div class="overlay app-loading" id="overlay">
  <div class="dialog">
    <h3>Alle Daten löschen?</h3>
    <p>Der gesamte Spielverlauf und alle Statistiken werden unwiderruflich gelöscht.</p>
    <div class="dialog-btns">
      <button class="btn-ghost" onclick="closeDialog()">Abbrechen</button>
      <button class="btn-primary" style="width:auto;margin-top:0" onclick="clearAll()">Löschen</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
