<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Durak – Registrieren</title>
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3f;
      --accent: #e63946;
      --accent2: #457b9d;
      --text: #e8e8f0;
      --muted: #7070a0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-container {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header .logo { font-size: 3rem; margin-bottom: 0.5rem; }
    .auth-header h1 { font-size: 1.5rem; font-weight: 700; }
    .auth-header h1 span { color: var(--accent); }
    .auth-header .sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.3rem; }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .auth-card h2 {
      font-size: 1.15rem;
      margin-bottom: 1.2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.85rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent2); }
    input::placeholder { color: var(--muted); }

    .btn-primary {
      width: 100%;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.72rem;
      background: var(--accent);
      color: #fff;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.87; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    .auth-footer {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    .error-msg {
      background: rgba(230, 57, 70, 0.15);
      border: 1px solid rgba(230, 57, 70, 0.3);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.83rem;
      color: var(--accent);
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.visible { display: block; }

    .success-msg {
      background: rgba(42, 157, 143, 0.15);
      border: 1px solid rgba(42, 157, 143, 0.3);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.83rem;
      color: #2a9d8f;
      margin-bottom: 1rem;
      display: none;
    }
    .success-msg.visible { display: block; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-header">
    <div class="logo">🃏</div>
    <h1>Durak <span>Tracker</span></h1>
    <div class="sub">Erstelle dein Konto</div>
  </div>

  <div class="auth-card">
    <h2>Registrieren</h2>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input id="email" type="email" placeholder="name@beispiel.de" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input id="password" type="password" placeholder="Mind. 6 Zeichen" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Passwort bestätigen</label>
        <input id="confirmPassword" type="password" placeholder="Passwort wiederholen" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Konto erstellen</button>
    </form>

    <div class="auth-footer">
      Bereits ein Konto? <a href="/login.html">Anmelden</a>
    </div>
  </div>
</div>

<script type="module" src="/src/auth.js"></script>
</body>
</html>
