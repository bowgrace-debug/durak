<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Durak – Login</title>
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3f;
      --accent: #e63946;
      --accent2: #457b9d;
      --text: #e8e8f0;
      --muted: #7070a0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-container {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header .logo { font-size: 3rem; margin-bottom: 0.5rem; }
    .auth-header h1 { font-size: 1.5rem; font-weight: 700; }
    .auth-header h1 span { color: var(--accent); }
    .auth-header .sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.3rem; }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .auth-card h2 {
      font-size: 1.15rem;
      margin-bottom: 1.2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.85rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent2); }
    input::placeholder { color: var(--muted); }

    .btn-primary {
      width: 100%;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.72rem;
      background: var(--accent);
      color: #fff;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.87; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.2rem 0;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      width: 100%;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.65rem;
      background: var(--surface2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: border-color 0.2s, transform 0.1s;
    }
    .btn-google:hover { border-color: var(--accent2); }
    .btn-google:active { transform: scale(0.97); }

    .auth-footer {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    .error-msg {
      background: rgba(230, 57, 70, 0.15);
      border: 1px solid rgba(230, 57, 70, 0.3);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.83rem;
      color: var(--accent);
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-header">
    <div class="logo">🃏</div>
    <h1>Durak <span>Tracker</span></h1>
    <div class="sub">Melde dich an, um weiterzuspielen</div>
  </div>

  <div class="auth-card">
    <h2>Anmelden</h2>

    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input id="email" type="email" placeholder="name@beispiel.de" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input id="password" type="password" placeholder="Passwort eingeben" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Anmelden</button>
    </form>

    <div class="divider">oder</div>

    <button class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.01 24.01 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Mit Google anmelden
    </button>

    <div class="auth-footer">
      Noch kein Konto? <a href="/signup.html">Registrieren</a>
    </div>
  </div>
</div>

<script type="module" src="/src/auth.js"></script>
</body>
</html>
