<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrieren – ZW-Unit</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="auth-page">

<div class="glass auth-card">
  <a class="logo" href="#" style="justify-content:center;margin-bottom:8px;">
    <img class="logo-img" src="./logo.png" alt="ZW-Unit Crew" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
    <span style="display:none;align-items:center;gap:10px;">
      <span class="logo-mark">ZW</span>
      <span class="logo-text">ZW-<span>UNIT</span></span>
    </span>
  </a>

  <h1>Account erstellen</h1>
  <p class="auth-sub">Tritt der ZW-Unit bei</p>

  <div id="error-msg" class="auth-error"></div>
  <div id="success-msg" class="auth-error" style="background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.3);color:var(--success);"></div>

  <form class="auth-form" id="register-form">
    <div class="input-wrap">
      <label for="email">E-Mail</label>
      <input type="email" id="email" placeholder="name@example.com" required autocomplete="email" />
    </div>
    <div class="input-wrap">
      <label for="password">Passwort</label>
      <input type="password" id="password" placeholder="Min. 8 Zeichen" required minlength="8" autocomplete="new-password" />
    </div>
    <div class="input-wrap">
      <label for="password2">Passwort bestätigen</label>
      <input type="password" id="password2" placeholder="••••••••" required autocomplete="new-password" />
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">
      Registrieren
    </button>
  </form>

  <div style="margin-top: 20px;">
    <div class="auth-link">Bereits registriert? <a href="./login.html">Anmelden</a></div>
  </div>
</div>

<div style="position: fixed; top: 16px; right: 16px;">
  <button class="theme-toggle" id="theme-btn"></button>
</div>

<script type="module">
  import { supabase } from '/src/supabase.js'
  import { redirectIfLoggedIn, initTheme, toggleTheme, themeIcon } from '/src/auth.js'

  initTheme()
  document.getElementById('theme-btn').textContent = themeIcon()

  await redirectIfLoggedIn()

  document.getElementById('theme-btn').addEventListener('click', () => {
    toggleTheme()
    document.getElementById('theme-btn').textContent = themeIcon()
  })

  const form = document.getElementById('register-form')
  const errEl = document.getElementById('error-msg')
  const sucEl = document.getElementById('success-msg')
  const btn = document.getElementById('submit-btn')

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    errEl.classList.remove('show')
    sucEl.classList.remove('show')

    const email = document.getElementById('email').value.trim()
    const pw1 = document.getElementById('password').value
    const pw2 = document.getElementById('password2').value

    if (pw1 !== pw2) {
      errEl.textContent = 'Passwörter stimmen nicht überein.'
      errEl.classList.add('show')
      return
    }

    btn.disabled = true
    btn.textContent = 'Registrieren...'

    const { error } = await supabase.auth.signUp({ email, password: pw1 })

    if (error) {
      errEl.textContent = error.message
      errEl.classList.add('show')
      btn.disabled = false
      btn.textContent = 'Registrieren'
    } else {
      sucEl.textContent = 'Fast geschafft! Bitte bestätige deine E-Mail-Adresse, dann kannst du dich anmelden.'
      sucEl.classList.add('show')
      btn.disabled = true
      btn.textContent = 'E-Mail gesendet'
    }
  })
</script>
</body>
</html>
